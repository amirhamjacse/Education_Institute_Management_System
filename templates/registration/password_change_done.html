{% extends 'institute/base.html' %}
{% load static %}
{% block title %}<title>Password Changed</title>{% endblock title %}

{% block leftside %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-4 text-center">
                <div class="card-body p-5">
                    <div class="rounded-circle bg-success bg-opacity-10 text-success d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                        <i class="fas fa-check-circle fa-2x"></i>
                    </div>
                    <h5 class="fw-bold text-dark mb-2">Password Successfully Changed!</h5>
                    <p class="text-muted small mb-4">Your account password has been updated.</p>
                    <a href="{% url 'students:dashobard_app' %}" class="btn btn-primary"><i class="fas fa-tachometer-alt me-1"></i> Go to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock leftside %}
{% block rightside %}{% endblock rightside %}
